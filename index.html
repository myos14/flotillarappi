<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HB BIKER — Panel de Flotilla</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
    :root {
        --red: #D7263D; --dark: #0f0f0f; --surface: #161616;
        --card: #1e1e1e; --border: #2a2a2a; --text: #f0f0f0;
        --muted: #777; --green: #22c55e;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--dark); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

    /* AUTH */
    .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .auth-box { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:40px 36px; width:100%; max-width:380px; }
    .auth-logo-img { width:100px; height:100px; object-fit:contain; display:block; margin:0 auto 6px; filter:drop-shadow(0 0 12px rgba(215,38,61,0.4)); }
    .auth-sub { font-size:13px; color:var(--muted); margin-bottom:28px; text-align:center; }
    .auth-tabs { display:flex; margin-bottom:24px; border-radius:10px; overflow:hidden; border:1px solid var(--border); }
    .auth-tab { flex:1; padding:10px; text-align:center; font-size:13px; font-weight:600; cursor:pointer; background:transparent; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; transition:all 0.2s; }
    .auth-tab.active { background:var(--red); color:#fff; }
    label { font-size:12px; font-weight:600; color:var(--muted); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:6px; margin-top:16px; }
    input, select { width:100%; background:var(--dark); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:border-color 0.2s; }
    input:focus, select:focus { border-color:var(--red); }
    select { appearance:none; cursor:pointer; }
    .btn-primary { width:100%; margin-top:24px; padding:14px; background:var(--red); color:#fff; border:none; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
    .btn-primary:hover { opacity:0.88; }
    .auth-msg { font-size:12px; text-align:center; margin-top:12px; min-height:18px; color:var(--muted); }
    .auth-msg.error { color:#ff6b6b; } .auth-msg.success { color:var(--green); }
    .forgot-link { text-align:center; font-size:12px; color:var(--muted); margin-top:14px; cursor:pointer; transition:color 0.2s; }
    .forgot-link:hover { color:var(--text); }
    #recovery-section { display:none; }

    /* TOPBAR */
    .topbar { background:var(--surface); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; justify-content:space-between; }
    .topbar-logo-img { height:38px; width:38px; object-fit:contain; filter:drop-shadow(0 0 6px rgba(215,38,61,0.5)); }
    .topbar-right { display:flex; align-items:center; gap:12px; }
    .topbar-user { font-size:13px; color:var(--muted); }
    .btn-logout { background:transparent; border:1px solid var(--border); color:var(--muted); padding:7px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--red); color:var(--red); }
    .main { padding:28px 20px; max-width:860px; margin:0 auto; }

    /* SECTION */
    .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:1px; }
    .rider-count { font-size:13px; color:var(--muted); margin-top:2px; }
    .btn-add { background:var(--red); color:#fff; border:none; padding:10px 18px; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; transition:opacity 0.2s; white-space:nowrap; }
    .btn-add:hover { opacity:0.85; } .btn-add:disabled { opacity:0.4; cursor:not-allowed; }
    .limit-banner { background:rgba(215,38,61,0.08); border:1px solid rgba(215,38,61,0.25); border-radius:10px; padding:12px 16px; font-size:13px; color:var(--red); margin-bottom:16px; display:none; }

    /* RIDER CARDS */
    .rider-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 20px; display:flex; flex-direction:column; gap:12px; margin-bottom:12px; }
    .rider-top { display:flex; align-items:center; gap:14px; }
    .rider-actions { display:flex; gap:8px; }
    .btn-icon-action { flex:1; background:var(--dark); border:1px solid var(--border); color:var(--muted); padding:8px 0; border-radius:8px; cursor:pointer; font-size:12px; font-weight:600; font-family:'DM Sans',sans-serif; transition:all 0.2s; text-align:center; }
    .btn-icon-action:hover { border-color:var(--red); color:var(--text); }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
    .modal { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:32px 28px; width:100%; max-width:460px; max-height:92vh; overflow-y:auto; }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:24px; letter-spacing:1px; margin-bottom:4px; }
    .modal-sub { font-size:13px; color:var(--muted); margin-bottom:20px; }
    .modal-actions { display:flex; gap:10px; margin-top:24px; }
    .btn-cancel { flex:1; padding:13px; background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; cursor:pointer; }
    .btn-save { flex:2; padding:13px; background:var(--red); border:none; color:#fff; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:opacity 0.2s; }
    .btn-save:hover { opacity:0.88; }
    .form-msg { font-size:12px; color:var(--muted); margin-top:10px; text-align:center; min-height:18px; }
    .form-msg.error { color:#ff6b6b; } .form-msg.success { color:var(--green); }

    /* QR MODAL */
    .qr-wrap { text-align:center; padding:10px 0; }
    .qr-btn-group { display:flex; flex-direction:column; gap:10px; margin-top:16px; }
    .btn-share { display:flex; align-items:center; justify-content:center; gap:8px; background:#1a9e4a; color:#fff; border:none; padding:13px 24px; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:700; cursor:pointer; width:100%; transition:opacity 0.2s; }
    .btn-share:hover { opacity:0.88; }
    .btn-regen { display:flex; align-items:center; justify-content:center; gap:8px; background:transparent; color:var(--muted); border:1px solid var(--border); padding:11px 20px; border-radius:12px; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; cursor:pointer; width:100%; transition:all 0.2s; }
    .btn-regen:hover { border-color:var(--muted); color:var(--text); } .btn-regen:disabled { opacity:0.4; cursor:not-allowed; }

    /* EMPTY */
    .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
    .empty-state .icon { font-size:40px; margin-bottom:12px; }
    .empty-state p { font-size:14px; line-height:1.6; }

    .hidden { display:none !important; }
    .fade-in { animation:fadeIn 0.3s ease both; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-section" class="auth-wrap">
  <div class="auth-box">
    <img src="./logo.jpeg" alt="HB Biker" class="auth-logo-img">
    <div class="auth-sub">Panel de jefe de flotilla</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
    </div>
    <div id="tab-login">
      <label>Correo electrónico</label>
      <input type="email" id="login-email" placeholder="ejemplo@gmail.com">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••">
      <button class="btn-primary" onclick="doLogin()">Entrar</button>
      <p class="auth-msg" id="login-msg"></p>
      <p class="forgot-link" onclick="doResetPassword()">¿Olvidaste tu contraseña?</p>
    </div>
    <div id="tab-register" class="hidden">
      <label>Nombre completo</label>
      <input type="text" id="reg-name" oninput="this.value=this.value.replace(/\b\w/g,c=>c.toUpperCase())">
      <label>Correo electrónico</label>
      <input type="email" id="reg-email">
      <label>Celular (para recibir ubicaciones)</label>
      <input type="tel" id="reg-phone" placeholder="Ingrese 10 dígitos" oninput="this.value=this.value.replace(/[^\d+\s\-]/g,'')">
      <label>Contraseña</label>
      <input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres">
      <button class="btn-primary" onclick="doRegister()">Crear cuenta</button>
      <p class="auth-msg" id="reg-msg"></p>
    </div>
  </div>
</div>

<!-- RECOVERY -->
<div id="recovery-section" class="auth-wrap">
  <div class="auth-box">
    <img src="./logo.jpeg" alt="HB Biker" class="auth-logo-img">
    <div class="auth-sub">Elige una nueva contraseña</div>
    <label>Nueva contraseña</label>
    <input type="password" id="recovery-pass" placeholder="Mínimo 8 caracteres">
    <label>Confirmar contraseña</label>
    <input type="password" id="recovery-pass2" placeholder="Repite tu contraseña">
    <button class="btn-primary" onclick="doUpdatePassword()">Guardar nueva contraseña</button>
    <p class="auth-msg" id="recovery-msg"></p>
  </div>
</div>

<!-- APP -->
<div id="app-section" class="hidden">
  <div class="topbar">
    <img src="./logo.jpeg" alt="HB Biker" class="topbar-logo-img">
    <div class="topbar-right">
      <span class="topbar-user" id="user-email"></span>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="main">
    <div class="section-header">
      <div>
        <div class="section-title">Mi Flotilla</div>
        <div class="rider-count" id="rider-count"></div>
      </div>
      <button class="btn-add" id="btn-add-rider" onclick="openAddModal()">＋ Agregar rider</button>
    </div>
    <div class="limit-banner" id="limit-banner">Límite alcanzado — máximo 50 riders por flotilla.</div>
    <div id="riders-list"></div>
  </div>
</div>

<!-- MODAL RIDER -->
<div class="modal-overlay hidden" id="rider-modal">
  <div class="modal fade-in">
    <div class="modal-title" id="modal-title">Nuevo Rider</div>
    <div class="modal-sub">Datos médicos visibles al escanear el QR de emergencia</div>
    <label>Nombre completo (obligatorio)</label>
    <input type="text" id="f-nombre" autocomplete="off" oninput="this.value=this.value.replace(/\b\w/g,c=>c.toUpperCase())">
    <label>Tipo de sangre (obligatorio)</label>
    <select id="f-sangre">
      <option value="" selected disabled>Selecciona un tipo de sangre</option>
      <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
      <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
    </select>
    <label>Condiciones médicas</label>
    <input type="text" id="f-condiciones" placeholder="Diabetes, hipertensión, etc.">
    <label>Medicamentos actuales</label>
    <input type="text" id="f-medicamentos" placeholder="Metformina 850mg, etc.">
    <label>Alergias</label>
    <input type="text" id="f-alergias" placeholder="Penicilina, pescado, etc.">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('rider-modal')">Cancelar</button>
      <button class="btn-save" onclick="saveRider()">Guardar</button>
    </div>
    <p class="form-msg" id="form-msg"></p>
  </div>
</div>

<!-- MODAL QR -->
<div class="modal-overlay hidden" id="qr-modal">
  <div class="modal fade-in" style="max-width:320px">
    <div class="modal-title">QR del Rider</div>
    <div class="modal-sub" id="qr-modal-sub"></div>
    <div class="qr-wrap" id="qr-wrap"></div>
    <div class="qr-btn-group">
      <button class="btn-share" onclick="shareQR()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Compartir QR por WhatsApp
      </button>
      <button class="btn-regen" id="btn-regen" onclick="regenQR()">🔄 Generar nuevo QR</button>
    </div>
    <p class="form-msg" id="qr-msg"></p>
    <div class="modal-actions" style="margin-top:16px">
      <button class="btn-cancel" style="flex:1" onclick="closeModal('qr-modal')">Cerrar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://tabnqjplnxnestyvnkkf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1fLtXbTcUJG941cd9n2MxA_vhwOymdH';
const BASE_URL          = 'https://myos14.github.io/flotillarappi/rider.html';
const RIDER_LIMIT       = 50;

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null, riders = [], editingId = null, qrRiderId = null;

function genUUID() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

/* AUTH TABS */
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) =>
    t.classList.toggle('active',(i===0)===(tab==='login')));
  document.getElementById('tab-login').classList.toggle('hidden', tab!=='login');
  document.getElementById('tab-register').classList.toggle('hidden', tab!=='register');
}

/* LOGIN */
async function doLogin() {
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  const msg=document.getElementById('login-msg');
  msg.className='auth-msg'; msg.textContent='Verificando...';
  const {error}=await db.auth.signInWithPassword({email,password:pass});
  if(error){msg.className='auth-msg error';msg.textContent='Correo o contraseña incorrectos.';}
}

/* REGISTER */
async function doRegister() {
  const name=document.getElementById('reg-name').value.trim();
  const email=document.getElementById('reg-email').value.trim();
  const phone=document.getElementById('reg-phone').value.trim();
  const pass=document.getElementById('reg-pass').value;
  const msg=document.getElementById('reg-msg');
  if(!name||!email||!phone||!pass){msg.className='auth-msg error';msg.textContent='Completa todos los campos.';return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.className='auth-msg error';msg.textContent='Escribe un correo válido.';return;}
  if(pass.length<8){msg.className='auth-msg error';msg.textContent='La contraseña debe tener al menos 8 caracteres.';return;}
  msg.className='auth-msg';msg.textContent='Creando cuenta...';
  const {error}=await db.auth.signUp({email,password:pass,options:{data:{nombre:name,telefono:phone}}});
  if(error){msg.className='auth-msg error';msg.textContent='Error: '+error.message;}
  else{msg.className='auth-msg success';msg.textContent='¡Cuenta creada! Revisa tu correo para confirmar.';}
}

/* RESET PASSWORD */
async function doResetPassword() {
  const email=document.getElementById('login-email').value.trim();
  const msg=document.getElementById('login-msg');
  if(!email){msg.className='auth-msg error';msg.textContent='Escribe tu correo primero.';return;}
  msg.className='auth-msg';msg.textContent='Enviando correo...';
  const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});
  if(error){msg.className='auth-msg error';msg.textContent='Error: '+error.message;}
  else{msg.className='auth-msg success';msg.textContent='Revisa tu correo — te mandamos el enlace de recuperación.';}
}

async function doUpdatePassword() {
  const p1=document.getElementById('recovery-pass').value;
  const p2=document.getElementById('recovery-pass2').value;
  const msg=document.getElementById('recovery-msg');
  if(p1.length<8){msg.className='auth-msg error';msg.textContent='Mínimo 8 caracteres.';return;}
  if(p1!==p2){msg.className='auth-msg error';msg.textContent='Las contraseñas no coinciden.';return;}
  msg.className='auth-msg';msg.textContent='Guardando...';
  const {error}=await db.auth.updateUser({password:p1});
  if(error){msg.className='auth-msg error';msg.textContent='Error: '+error.message;}
  else{msg.className='auth-msg success';msg.textContent='¡Contraseña actualizada!';setTimeout(()=>location.reload(),1500);}
}

async function doLogout(){await db.auth.signOut();location.reload();}

/* SESSION */
function showApp(user){
  currentUser=user;
  document.getElementById('auth-section').style.display='none';
  document.getElementById('recovery-section').style.display='none';
  document.getElementById('app-section').classList.remove('hidden');
  document.getElementById('user-email').textContent=user.email;
  loadRiders();
}
function showAuth(){
  currentUser=null;
  document.getElementById('auth-section').style.display='';
  document.getElementById('recovery-section').style.display='none';
  document.getElementById('app-section').classList.add('hidden');
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(session?.user&&!currentUser) showApp(session.user);
})();

db.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'){
    document.getElementById('auth-section').style.display='none';
    document.getElementById('recovery-section').style.display='flex';
    document.getElementById('app-section').classList.add('hidden');
    return;
  }
  if(session?.user){
    const already=currentUser?.id===session.user.id;
    showApp(session.user);
    if(already)return;
  } else { showAuth(); }
});

/* RIDERS */
async function loadRiders(){
  const {data}=await db.from('riders').select('*').eq('jefe_id',currentUser.id).order('nombre');
  riders=data||[];
  renderRiders();
}

function renderRiders(){
  const list=document.getElementById('riders-list');
  const addBtn=document.getElementById('btn-add-rider');
  const banner=document.getElementById('limit-banner');
  const count=riders.length;
  document.getElementById('rider-count').textContent=
    `${count} de ${RIDER_LIMIT} rider${count!==1?'s':''} registrado${count!==1?'s':''}`;
  addBtn.disabled=count>=RIDER_LIMIT;
  banner.style.display=count>=RIDER_LIMIT?'block':'none';
  if(!count){
    list.innerHTML=`<div class="empty-state"><div class="icon">🏍️</div><p>Aún no tienes riders registrados.<br>Toca "Agregar rider" para comenzar.</p></div>`;
    return;
  }
  list.innerHTML=riders.map(r=>`
    <div class="rider-card fade-in">
      <div class="rider-top">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--red);min-width:44px">${r.tipo_sangre||'?'}</div>
        <div>
          <div style="font-weight:700;font-size:15px">${r.nombre}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">${[r.condiciones,r.alergias].filter(Boolean).join(' · ')||'Sin condiciones registradas'}</div>
        </div>
      </div>
      <div class="rider-actions">
        <button class="btn-icon-action" onclick="openQR('${r.id}')">Mostrar QR</button>
        <button class="btn-icon-action" onclick="openEditModal('${r.id}')">Editar</button>
        <button class="btn-icon-action" data-id="${r.id}" data-nombre="${r.nombre.replace(/"/g,'&quot;')}" onclick="deleteRider(this)">Eliminar</button>
      </div>
    </div>`).join('');
}

/* ADD / EDIT */
function openAddModal(){
  if(riders.length>=RIDER_LIMIT)return;
  editingId=null;
  document.getElementById('modal-title').textContent='Nuevo Rider';
  ['nombre','sangre','condiciones','medicamentos','alergias'].forEach(k=>document.getElementById('f-'+k).value='');
  document.getElementById('form-msg').textContent='';
  document.getElementById('rider-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-nombre').focus(),100);
}
function openEditModal(id){
  editingId=id;
  const r=riders.find(x=>x.id===id);if(!r)return;
  document.getElementById('modal-title').textContent='Editar Rider';
  document.getElementById('f-nombre').value=r.nombre||'';
  document.getElementById('f-sangre').value=r.tipo_sangre||'';
  document.getElementById('f-condiciones').value=r.condiciones||'';
  document.getElementById('f-medicamentos').value=r.medicamentos||'';
  document.getElementById('f-alergias').value=r.alergias||'';
  document.getElementById('form-msg').textContent='';
  document.getElementById('rider-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('f-nombre').focus(),100);
}
async function saveRider(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const tipo_sangre=document.getElementById('f-sangre').value;
  const msg=document.getElementById('form-msg');
  if(!nombre||!tipo_sangre){msg.className='form-msg error';msg.textContent='Nombre y tipo de sangre son obligatorios.';return;}
  if(!editingId&&riders.length>=RIDER_LIMIT){msg.className='form-msg error';msg.textContent='Límite alcanzado.';return;}
  msg.className='form-msg';msg.textContent='Guardando...';
  const payload={nombre,tipo_sangre,
    condiciones:document.getElementById('f-condiciones').value.trim()||null,
    medicamentos:document.getElementById('f-medicamentos').value.trim()||null,
    alergias:document.getElementById('f-alergias').value.trim()||null,
    telefono_jefe:currentUser.user_metadata?.telefono||null,
    jefe_id:currentUser.id};
  let error;
  if(editingId){({error}=await db.from('riders').update(payload).eq('id',editingId));}
  else{payload.token_qr=genUUID();payload.token_activo=true;({error}=await db.from('riders').insert(payload));}
  if(error){msg.className='form-msg error';msg.textContent='Error: '+error.message;}
  else{closeModal('rider-modal');loadRiders();}
}
async function deleteRider(btn){
  if(!confirm(`¿Eliminar a ${btn.dataset.nombre}?`))return;
  await db.from('riders').delete().eq('id',btn.dataset.id);
  loadRiders();
}

/* QR */
async function openQR(id){
  qrRiderId=id;
  const r=riders.find(x=>x.id===id);if(!r)return;
  document.getElementById('qr-modal-sub').textContent=r.nombre;
  document.getElementById('qr-msg').textContent='';
  document.getElementById('qr-msg').className='form-msg';
  document.getElementById('qr-modal').classList.remove('hidden');
  renderQRCanvas(r.token_qr);
}

function renderQRCanvas(token){
  const url=`${BASE_URL}?token=${token}`;
  const wrap=document.getElementById('qr-wrap');
  wrap.innerHTML='';
  // Nivel M: buen balance densidad/legibilidad — L es más escaneable pero menos
  // resistente a daños físicos. M funciona en prácticamente todos los lectores.
  new QRCode(wrap,{
    text:url, width:260, height:260,
    colorDark:'#000000', colorLight:'#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  setTimeout(()=>{
    const canvas=wrap.querySelector('canvas');
    const img=wrap.querySelector('img');
    if(canvas) canvas.style.cssText='border-radius:10px;display:block;margin:0 auto';
    if(img) img.style.display='none';
  },80);
}

/* COMPARTIR */
async function shareQR(){
  const r=riders.find(x=>x.id===qrRiderId);
  const msg=document.getElementById('qr-msg');
  if(!r)return;
  const qrPageUrl=`${BASE_URL}?token=${r.token_qr}`;
  let tel=(r.telefono_jefe||'').replace(/\D/g,'');
  if(tel.length===10) tel='52'+tel;
  const canvas=document.querySelector('#qr-wrap canvas');
  if(canvas&&navigator.share){
    try{
      msg.className='form-msg';msg.textContent='Preparando imagen...';
      const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error('toBlob falló')),'image/png'));
      const file=new File([blob],`QR_${r.nombre.replace(/\s+/g,'_')}.png`,{type:'image/png'});
      const shareData={files:[file],title:`QR — ${r.nombre}`,text:`🏍️ QR médico de ${r.nombre}\n${qrPageUrl}`};
      if(navigator.canShare&&navigator.canShare(shareData)){
        await navigator.share(shareData);
        msg.className='form-msg success';msg.textContent='¡QR compartido!';return;
      }
      await navigator.share({title:`QR — ${r.nombre}`,url:qrPageUrl});
      msg.className='form-msg success';msg.textContent='¡Link compartido!';return;
    }catch(e){
      if(e.name==='AbortError'){msg.className='form-msg';msg.textContent='';return;}
    }
  }
  msg.className='form-msg';msg.textContent='Abriendo WhatsApp...';
  const waText=encodeURIComponent(`🏍️ *QR de emergencia — ${r.nombre}*\n\nEscanea este código para ver su información médica:\n${qrPageUrl}`);
  const link=document.createElement('a');
  link.href=tel?`https://wa.me/${tel}?text=${waText}`:`https://wa.me/?text=${waText}`;
  link.target='_blank';link.rel='noopener';
  document.body.appendChild(link);link.click();document.body.removeChild(link);
  setTimeout(()=>{msg.textContent='';},2000);
}

/* REGEN QR */
let regenPendingConfirm=false,regenConfirmTimer=null;
async function regenQR(){
  const msg=document.getElementById('qr-msg');
  const btn=document.getElementById('btn-regen');
  if(!regenPendingConfirm){
    regenPendingConfirm=true;
    btn.textContent='⚠️ ¿Confirmar? Toca de nuevo';
    btn.style.borderColor='#D7263D';btn.style.color='#D7263D';
    msg.className='form-msg';msg.textContent='El QR anterior dejará de funcionar.';
    regenConfirmTimer=setTimeout(()=>resetRegenBtn(btn,msg),4000);return;
  }
  clearTimeout(regenConfirmTimer);regenPendingConfirm=false;resetRegenBtn(btn,msg);
  msg.className='form-msg';msg.textContent='Generando nuevo QR...';btn.disabled=true;
  const newToken=genUUID();
  const {error}=await db.from('riders').update({token_qr:newToken}).eq('id',qrRiderId);
  if(error){msg.className='form-msg error';msg.textContent='Error: '+error.message;btn.disabled=false;return;}
  await loadRiders();
  const updated=riders.find(x=>x.id===qrRiderId);
  if(updated) renderQRCanvas(updated.token_qr);
  msg.className='form-msg success';msg.textContent='✓ Nuevo QR generado correctamente.';btn.disabled=false;
}
function resetRegenBtn(btn,msg){
  regenPendingConfirm=false;
  btn.textContent='🔄 Generar nuevo QR';
  btn.style.borderColor='';btn.style.color='';
  if(msg&&msg.textContent==='El QR anterior dejará de funcionar.') msg.textContent='';
}

function closeModal(id){
  document.getElementById(id).classList.add('hidden');
  if(id==='qr-modal'){clearTimeout(regenConfirmTimer);resetRegenBtn(document.getElementById('btn-regen'),document.getElementById('qr-msg'));}
}
document.querySelectorAll('.modal-overlay').forEach(o=>{
  o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden');});
});
</script>
