<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergencia — HB BIKER</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --red:    #C0202F;
    --dark:   #111111;
    --card:   #1c1c1c;
    --border: #2e2e2e;
    --text:   #efefef;
    --muted:  #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }

  .header {
    width: 100%; background: var(--red);
    padding: 28px 24px 22px;
    text-align: center; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .header-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 12px; letter-spacing: 5px;
    color: rgba(255,255,255,0.6); margin-bottom: 4px;
  }
  .blood-type {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 76px; color: #fff; line-height: 1; letter-spacing: 2px;
  }
  .emergency-tag {
    display: inline-block;
    background: rgba(0,0,0,0.22); color: rgba(255,255,255,0.9);
    font-size: 11px; font-weight: 700; letter-spacing: 4px;
    padding: 5px 14px; border-radius: 20px; margin-top: 10px;
  }

  .content {
    width: 100%; max-width: 440px;
    padding: 20px 16px 48px;
    display: flex; flex-direction: column; gap: 10px;
  }

  .name-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 20px; text-align: center;
  }
  .name-card .label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 5px;
  }
  .name-card .name { font-size: 20px; font-weight: 700; }

  .info-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
  }
  .info-row {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 4px;
  }
  .info-row .value { font-size: 14px; font-weight: 500; line-height: 1.5; }
  .empty { color: var(--muted); font-style: italic; }

  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    padding: 16px 20px; border-radius: 12px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700;
    cursor: pointer; text-decoration: none; letter-spacing: 0.2px;
    transition: opacity 0.15s, transform 0.12s;
  }
  .btn:active { transform: scale(0.98); opacity: 0.88; }
  .btn-whatsapp { background: #1a9e4a; color: #fff; }
  .btn-call     { background: #1d5fa8; color: #fff; }
  .btn-911      { background: var(--red); color: #fff; }

  .location-status {
    font-size: 12px; color: var(--muted);
    text-align: center; min-height: 18px;
  }

  .state-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; gap: 16px; padding: 40px; text-align: center;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border); border-top-color: var(--red);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 18px; font-weight: 600; }
  .state-sub   { font-size: 14px; color: var(--muted); }

  .fade-in { animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app">
  <div class="state-screen">
    <div class="spinner"></div>
    <p class="state-title">Cargando información</p>
    <p class="state-sub">Por favor espera...</p>
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://tabnqjplnxnestyvnkkf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_1fLtXbTcUJG941cd9n2MxA_vhwOymdH';

function getToken() {
  return new URLSearchParams(window.location.search).get('token');
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="state-screen">
      <p class="state-title">QR no válido</p>
      <p class="state-sub">${msg}</p>
    </div>`;
}

function val(v, fallback = '—') {
  return (v && v.trim()) ? v.trim() : `<span class="empty">${fallback}</span>`;
}

async function loadRider() {
  const token = getToken();
  if (!token) return renderError('Este QR no tiene un identificador válido.');

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_rider_by_token`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ p_token: token })
    });

    const data = await response.json();

    if (!response.ok || !data || data.length === 0) return renderError('No se encontró información para este QR.');
    if (!data[0].token_activo) return renderError('Este QR fue desactivado. Contacta al jefe de flotilla.');

    const r = data[0];

    document.getElementById('app').innerHTML = `
      <div class="header fade-in">
        <div class="header-label">Tipo de sangre</div>
        <div class="blood-type">${r.tipo_sangre || '?'}</div>
        <div class="emergency-tag">EMERGENCIA</div>
      </div>
      <div class="content fade-in">
        <div class="name-card">
          <div class="label">Repartidor</div>
          <div class="name">${r.nombre || 'Sin nombre'}</div>
        </div>
        <div class="info-card">
          <div class="info-row">
            <div class="label">Condiciones médicas</div>
            <div class="value">${val(r.condiciones, 'Sin condiciones registradas')}</div>
          </div>
          <div class="info-row">
            <div class="label">Medicamentos actuales</div>
            <div class="value">${val(r.medicamentos, 'Sin medicamentos registrados')}</div>
          </div>
          <div class="info-row">
            <div class="label">Alergias</div>
            <div class="value">${val(r.alergias, 'Sin alergias registradas')}</div>
          </div>
        </div>
        <div class="buttons">
          <button class="btn btn-whatsapp" onclick="sendLocation()">
            Enviar ubicación al jefe
          </button>
          <p class="location-status" id="loc-status"></p>
          <a class="btn btn-call" href="tel:${r.telefono_jefe || ''}">
            Llamar al jefe de flotilla
          </a>
          <a class="btn btn-911" href="tel:911">
            Llamar al 911
          </a>
        </div>
      </div>`;

    window._jefeTel     = r.telefono_jefe;
    window._riderNombre = r.nombre;

  } catch (e) {
    renderError('Error de conexión. Verifica tu internet e intenta de nuevo.');
  }
}

function sendLocation() {
  const status = document.getElementById('loc-status');
  if (!navigator.geolocation) {
    status.textContent = 'Tu navegador no soporta geolocalización.'; return;
  }
  status.textContent = 'Obteniendo ubicación...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat  = pos.coords.latitude.toFixed(6);
      const lng  = pos.coords.longitude.toFixed(6);
      const maps = `https://maps.google.com/?q=${lat},${lng}`;
      const msg  = encodeURIComponent(
        `EMERGENCIA\n*${window._riderNombre || 'Un repartidor'}* necesita ayuda.\nUbicación:\n${maps}`
      );
      const tel  = (window._jefeTel || '').replace(/\D/g, '');
      status.textContent = 'Abriendo WhatsApp...';
      const link = document.createElement('a');
      link.href = `https://wa.me/${tel}?text=${msg}`;
      link.target = '_blank';
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    },
    () => { status.textContent = 'No se pudo obtener ubicación. Permite el acceso al GPS.'; },
    { timeout: 10000, enableHighAccuracy: true }
  );
}

loadRider();
</script>
</body>
</html>
